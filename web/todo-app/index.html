<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-do List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Minhas Tarefas</h1>

    <div class="input-area">
      <input type="text" id="taskInput" placeholder="Nova tarefa..." maxlength="100" />
      <button id="addBtn">Adicionar</button>
    </div>

    <div class="filters">
      <button class="filter active" data-filter="all">Todas</button>
      <button class="filter" data-filter="pending">Pendentes</button>
      <button class="filter" data-filter="done">Concluídas</button>
    </div>

    <ul id="taskList"></ul>

    <div class="footer">
      <span id="counter">0 tarefas pendentes</span>
      <button id="clearDone">Limpar concluídas</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
